<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEWTACK</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #02070d;
}

body {
  overflow-x: hidden;
}

/* 전체 구조 단순화 */
.homepage {
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  background: #02070d;
}

/* 10.png 그대로 표시 */
.main-image {
  width: 100%;
  display: block;
}

/* 모바일에서도 화면폭에 맞춤 */
@media (max-width: 768px) {
  .homepage {
    width: 100%;
  }

  .main-image {
    width: 100%;
    height: auto;
  }
}
</style>
</head>

<body>

<div class="homepage">
  <img src="10.png" alt="NEWTACK 홈페이지 메인 시안" class="main-image">
</div>

</body>
</html>
